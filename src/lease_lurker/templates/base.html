<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t("app_title") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Lease<span>Lurker</span></a>
      <nav aria-label="{{ t('language') }}">
        <a href="/locale/de" lang="de"{% if locale == "de" %} aria-current="page"{% endif %}>DE</a>
        <span aria-hidden="true">·</span>
        <a href="/locale/en" lang="en"{% if locale == "en" %} aria-current="page"{% endif %}>EN</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>LeaseLurker · Read-only DHCP discovery</footer>
  </body>
</html>
