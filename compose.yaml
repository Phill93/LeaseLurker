services:
  lease-lurker:
    image: ghcr.io/phill93/leaselurker:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LEASELURKER_CONFIG: /etc/lease-lurker/config.yaml
      LEASELURKER_KEA_URL: http://host.docker.internal:8000/
      LEASELURKER_KEA_USERNAME:
      LEASELURKER_KEA_PASSWORD:
    volumes:
      - ./config.yaml:/etc/lease-lurker/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
